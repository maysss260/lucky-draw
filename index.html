<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一番賞｜Tower Records Ultimate</title>

<style>

.machine{
position:relative;
width:100%;
height:180px;
min-height:180px;
display:flex;
flex-direction:column;
align-items:center;
overflow:hidden;
}
display:flex;
flex-direction:column;
align-items:center;
}

.machine .drawBtn{
margin-top:20px;
position:relative;
z-index:9999;
display:block;
}

body{
margin:0;
padding:20px;
font-family:"Noto Sans TC",sans-serif;
background:linear-gradient(135deg,#070818,#1d1240,#000);
color:white;
}

h2{
text-align:center;
color:#ffeaa7;
margin-bottom:20px;
}

.drawBtn{
width:100%;
padding:24px;
font-size:30px;
font-weight:bold;
border:none;
border-radius:20px;
cursor:pointer;
background:linear-gradient(to right,#ffeaa7,#fff6d0);
color:#241248;
box-shadow:0 0 30px rgba(255,234,167,.8);
margin-bottom:12px;
}

.subBtn{
width:100%;
padding:8px;
font-size:13px;
opacity:.55;
background:#444;
color:white;
border:none;
border-radius:10px;
margin:4px 0;
}

.hidden{
display:none;
}

.card{
background:#222;
padding:10px;
border-radius:10px;
margin:10px 0;
}

input{
width:100%;
padding:8px;
margin:4px 0;
border:none;
border-radius:8px;
box-sizing:border-box;
}

.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);

justify-content:center;
align-items:center;

overflow-y:auto;
padding:20px;
box-sizing:border-box;
}
overflow:auto;
padding:20px;
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.93);
z-index:999;
}

/* 抽獎機 */

.machine{

width:300px;
height:360px;

overflow:hidden;

position:relative;

border:3px solid #ffeaa7;

border-radius:18px;

background:#111;

}

.track{
position:absolute;
left:0;
top:0;
width:100%;
animation:reelRoll 2.5s linear infinite;
will-change:transform;
}

@keyframes reelRoll{
from{transform:translateY(0);}
to{transform:translateY(-3300px);}
}

.item{

height: 60px;

display:flex;

justify-content:center;

align-items:center;

box-sizing:border-box;

font-size:18px;

border-bottom:
1px solid rgba(
255,
255,
255,
.08
);

}

.window{
position:absolute;
top:50%;
transform:translateY(-50%);
left:0;
right:0;
height:72px;
border-top:4px solid #ffeaa7;
border-bottom:4px solid #ffeaa7;
background:rgba(255,234,167,.08);
pointer-events:none;
}

.rank-A{
color:#ff4040;
font-weight:bold;
}

.rank-B{
color:#ff9c2e;
font-weight:bold;
}

.rank-C{
color:#ffe44a;
font-weight:bold;
}

.rank-D{
color:#52e052;
font-weight:bold;
}

.big{
font-size:70px;
text-align:center;
}

.result{
text-align:center;
}

#historyLog{
max-height:400px;
overflow:auto;
}

.historyItem{
padding:6px;
border-bottom:1px solid #333;
font-size:14px;
}

@keyframes float{
  0%{
    transform: translateY(0px);
  }
  

  50%{
    transform: translateY(-10px);
  }

  100%{
    transform: translateY(0px);
  }
}

@keyframes glow{
  from{
    filter:
    drop-shadow(0 0 8px rgba(255,255,255,.7))
    drop-shadow(0 0 16px rgba(255,255,255,.5))
    drop-shadow(0 0 28px rgba(255,255,255,.3));
  }

  to{
    filter:
    drop-shadow(0 0 12px rgba(255,255,255,1))
    drop-shadow(0 0 24px rgba(255,255,255,.9))
    drop-shadow(0 0 40px rgba(255,255,255,.7))
    drop-shadow(0 0 60px rgba(255,255,255,.5));
}
}

.drawPanel{
  width:min(360px,100%);
  box-sizing:border-box;
  padding:18px 18px 20px;
  border:2px solid #ffeaa7;
  border-radius:22px;
  background:rgba(17,17,17,.96);
  box-shadow:0 0 28px rgba(255,234,167,.18);
}
.drawPanel .machine{
  width:100%;
  box-sizing:border-box;
  border:0;
  border-radius:12px;
  box-shadow:none;
}
.drawControl{
  padding-top:12px;
}
.drawControl .drawBtn{
  margin:0;
  width:100%;
  padding:16px;
  font-size:24px;
  border-radius:14px;
  box-shadow:0 0 18px rgba(255,234,167,.35);
}

@media (min-width: 768px){

  .drawPanel{
    width:680px;
    max-width:90vw;
  }

  .drawControl .drawBtn{
    font-size:30px;
    padding:20px;
  }

  .item{
    font-size:24px;
  }

}
.startBtn {
    width: 180px;
    margin: 0 auto 15px;
    display: block;
}

.machine {
    transform: scale(1.15);
    transform-origin: center center;
}

body {
    zoom: 1.5;
}
  
</style>
</head>

</div>
<h2>🔮魔法師小娟的占卜屋🔮</h2>



<button class="drawBtn startBtn" onclick="draw()">
開始抽獎
</button>


<button class="subBtn" onclick="toggleAdmin()">
⚙️管理
</button>

<button class="subBtn" onclick="toggleHistory()">
📜紀錄
</button>

<div id="admin" class="hidden"></div>

<div id="historyBox" class="hidden card">

<h3>抽獎紀錄</h3>

<div id="historyLog"></div>

<button onclick="clearHistory()">
清空紀錄
</button>

</div>

<div class="overlay" id="overlay">
<div id="content"></div>
</div>


<script>


let drumSound=
localStorage.getItem("drumSound")
||"";

let gongSound=
localStorage.getItem("gongSound")
||"";

let history=
JSON.parse(
localStorage.getItem("history")
)||[];

let prizes=
JSON.parse(
localStorage.getItem("prizes")
)
||
[
{rank:"A賞",name:"無框畫",count:15},
{rank:"B賞",name:"手幅",count:7},
{rank:"C賞",name:"手持風扇小卡組",count:7},
{rank:"D賞",name:"壓克力立牌",count:7},
{rank:"E賞",name:"明信片任選3張",count:50},
{rank:"F賞",name:"小卡一套5張",count:50},
{rank:"G賞",name:"sonini壓克力雨傘吊飾",count:40},
{rank:"H賞",name:"隨機專輯",count:20},
];

function save(){

localStorage.setItem(
"prizes",
JSON.stringify(prizes)
);

localStorage.setItem(
"history",
JSON.stringify(history)
);

}

function toggleAdmin(){

document
.getElementById(
"admin"
)
.classList.toggle(
"hidden"
);

}

function toggleHistory(){

document
.getElementById(
"historyBox"
)
.classList.toggle(
"hidden"
);

}

function render(){

const admin=
document.getElementById(
"admin"
);

admin.innerHTML="";

prizes.forEach((p,i)=>{

admin.innerHTML+=`

<div class="card">

<input
value="${p.rank}"
onchange="
prizes[${i}].rank=this.value;
save()
">

<input
value="${p.name}"
onchange="
prizes[${i}].name=this.value;
save()
">

<input
type="number"
value="${p.count}"
onchange="
prizes[${i}].count=parseInt(this.value)||0;
save()
">

<button onclick="
removePrize(${i})
">
刪除
</button>

</div>

`;

});

admin.innerHTML+=`

<div class="card">

<h3>音效設定</h3>

<div>🥁 抽獎音效</div>

<input
type="file"
accept="audio/*"
onchange="saveDrum(event)"
>

<div style="margin-top:10px">

🔔 中獎音效

</div>

<input
type="file"
accept="audio/*"
onchange="saveGong(event)"
>

</div>

<button onclick="
addPrize()
">

＋新增獎項

</button>

`;

}

function addPrize(){

prizes.push({
rank:"賞",
name:" ",
count:1
});

save();

render();

}

function removePrize(i){

prizes.splice(i,1);

save();

render();

}

function renderHistory(){

document
.getElementById(
"historyLog"
)
.innerHTML=

history.map(x=>

`<div class="historyItem">

${x}

</div>`

).join("");

}

function clearHistory(){

history=[];

save();

renderHistory();

}

function saveDrum(e){

const file=
e.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=()=>{

drumSound=
reader.result;

localStorage.setItem(
"drumSound",
drumSound
);

alert(
"抽獎音效已儲存"
);

};

reader.readAsDataURL(file);

}

function saveGong(e){

const file=
e.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=()=>{

gongSound=
reader.result;

localStorage.setItem(
"gongSound",
gongSound
);

alert(
"中獎音效已儲存"
);

};

reader.readAsDataURL(file);

}

let drawAudio = null;
let winAudio = null;

/* 預先準備抽獎音效 */
function prepareDrawSound(){

if(!drumSound)return;

if(!drawAudio){

drawAudio = new Audio(drumSound);

drawAudio.volume = .8;
drawAudio.loop = true;

/* 提前載入音效 */
drawAudio.preload = "auto";
drawAudio.load();

}

}

/* 播放抽獎音效 */
function playDrawSound(){

if(!drumSound)return;

if(!drawAudio){
prepareDrawSound();
}

if(drawAudio){

drawAudio.currentTime = 0;

const promise =
drawAudio.play();

if(promise){

promise.catch(()=>{
console.log("抽獎音效等待使用者操作");
});

}

}

}

/* 停止抽獎音效 */
function stopDrawSound(){

if(drawAudio){

drawAudio.pause();
drawAudio.currentTime = 0;

}

}
function playWinSound(){

if(!gongSound)return;

winAudio = new Audio(gongSound);
winAudio.volume = .9;
winAudio.loop = false;

winAudio.play();

}

prepareDrawSound();
  
let stopTimeout=null;
let currentSelected=null;
let isDrawing=false;

let targetIndex=48;

function draw(){

if(isDrawing)return;

let pool=[];

prizes.forEach(p=>{

for(let i=0;i<p.count;i++){
pool.push({...p});
}

});

if(pool.length===0){
alert("全部抽完");
return;
}

playDrawSound();

currentSelected=
pool[Math.floor(Math.random()*pool.length)];

let baseReel=[];

for(let i=0;i<55;i++){

baseReel.push(
pool[Math.floor(Math.random()*pool.length)]
);

}



baseReel[targetIndex]={...currentSelected};

/*
  把同一組 55 格重複多次。
  這樣轉盤可以無限滾動，不會因為跑到最後一格而自己停下來。
*/
let reel=[];
for(let r=0;r<6;r++){
reel.push(...baseReel);
}

isDrawing=true;

document.getElementById(
"overlay"
).style.display="flex";

document.getElementById(
"content"
).innerHTML=`

<div class="machine">

<div class="track" id="track">

${reel.map(x=>`

<div class="
item rank-${x.rank.charAt(0)}
">
${x.rank}&nbsp;｜&nbsp;${x.name}
</div>

`).join("")}

</div>

<div class="window"></div>

</div>

<div style="display:flex;justify-content:center;margin-top:45px">
<button
id="stopButton"
class="drawBtn"
onclick="stopDraw()"
>
🪄停止  🪄
</button>
</div>
</div>

`;

}

function getCurrentTranslateY(track){

const transform=
getComputedStyle(track).transform;

if(!transform || transform==="none")return 0;

const match=
transform.match(/matrix(3d)?\\(([^)]+)\\)/);

if(!match)return 0;

const values=
match[2].split(",").map(Number);

return match[1]
? values[13]
: values[5];

}

function stopDraw(){

if(!isDrawing || !currentSelected)return;

const track=
document.getElementById("track");

if(!track)return;

/* 先把目前正在滾動的位置凍結 */
const currentY=
getCurrentTranslateY(track);

track.style.animation="none";
track.style.transform=
`translateY(${currentY}px)`;

/* 強制瀏覽器套用目前位置 */
track.offsetHeight;

/*
  每 55 格重複一次。
  第 48 格是中獎獎項。
  +90px 為目前實際視窗位置的校正值。
*/
const itemHeight=60;
const blockHeight=55*itemHeight;

const machineHeight=360;
const itemCenter=itemHeight/2;

const targetOffset=
(48*itemHeight)
+itemCenter
-(machineHeight/2)
+90;

let baseTargetY=
-targetOffset;

while(baseTargetY>=currentY){
baseTargetY-=blockHeight;
}

const targetY=baseTargetY;

/* 1 秒自然減速停下 */
track.style.transition=
"transform 5s cubic-bezier(2,0.9,0,1)";

track.style.transform=
`translateY(${targetY}px)`;

/* 等動畫完整跑完再顯示結果 */
stopTimeout=
setTimeout(()=>{

stopDrawSound();



playWinSound();

track.style.transition="none";

finishDraw(
currentSelected.rank,
currentSelected.name
);

currentSelected=null;
isDrawing=false;

},500);

}

function finishDraw(rank,name){

const real=
prizes.find(
p=>p.rank===rank
&& p.name===name
);

if(real){
real.count--;
}

history.unshift(
`${new Date().toLocaleString("zh-TW")}｜${rank}｜${name}`
);

save();
renderHistory();

document.getElementById(
"content"
).innerHTML=`

<div class="result">

<div class="
big rank-${rank.charAt(0)}
">
${rank}
</div>

<h2 class="
rank-${rank.charAt(0)}
">
